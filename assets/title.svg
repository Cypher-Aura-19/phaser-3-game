<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="400"
   height="96"
   viewBox="0 0 400 96"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   id="echo7-title">
  <style>
    .title-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      fill: #ffffff;
      stroke: #ffffff;
      stroke-width: 0.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bracket {
      fill: #ffffff;
      opacity: 0.6;
    }
  </style>
  <g id="layer1" opacity="0">
    <animate
       attributeName="opacity"
       values="0;1"
       begin="0.25s"
       dur="1s" />
    <set
       attributeName="opacity"
       to="1"
       begin="1.25s" />
    <!-- Main title: ECHO-7 -->
    <text
       x="200"
       y="58"
       text-anchor="middle"
       font-family="'Courier New', Courier, monospace"
       font-weight="bold"
       font-size="52"
       fill="#ffffff"
       stroke="#ffffff"
       stroke-width="0.2"
       letter-spacing="8"
       aria-label="ECHO-7">ECHO-7</text>
    <!-- Subtitle: FRAGMENT COLLECTOR -->
    <text
       x="200"
       y="85"
       text-anchor="middle"
       font-family="'Courier New', Courier, monospace"
       font-weight="normal"
       font-size="13"
       fill="#ffffff"
       opacity="0.75"
       letter-spacing="3">FRAGMENT COLLECTOR</text>
  </g>
</svg>
